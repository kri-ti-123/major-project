<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>drivers</title>
    <link rel="stylesheet" href="drivers.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    
<!-- NAVBAR -->

<div class="navbar">

<div class="logo">
<span class="servi">Servi</span><span class="go">GO</span>
</div>

<div class="nav-links">
<a href="#">Home</a>
<a href="#">Deliveries</a>
<a href="#">Earnings</a>
<a href="#"><i class="fa fa-user"></i> Profile</a>
</div>

</div>

<!-- IMAGE -->

<div class="banner">
<img src="https://images.unsplash.com/photo-1607083206968-13611e3d76db">
</div>

<!-- SERVICES -->

<div class="services">

<button>Food Delivery</button>
<button>Grocery Delivery</button>
<button><i class="fa fa-user"></i> Driver</button>

</div>

<!-- ONLINE OFFLINE SWITCH -->

<div class="status-bar">

<label class="switch">
<input type="checkbox" checked>
<span class="slider"></span>
</label>

</div>

<!-- DASHBOARD -->

<div class="dashboard">

<!-- NEW DELIVERY -->

<div class="card">

<p><b>New Delivery Request</b></p>

<p>#1234</p>

<p><i class="fa fa-map-marker-alt"></i> Pick up Location</p>

<p><i class="fa fa-location-dot"></i> Delivery Location</p>

<p><b>Earning : ₹75.00</b></p>

<div class="btns">

<button class="accept">Accept</button>
<button class="decline">Decline</button>

</div>

</div>

<!-- CURRENT DELIVERY -->

<div class="card">

<h3>Current Delivery</h3>

<p>Customer name : ______</p>

<p>Status : On the way</p>

<div class="map">
Map
</div>

</div>

<!-- EARNINGS -->

<div class="card">

<h3>Earnings Summary</h3>

<p><i class="fa fa-coins"></i> Today's Earnings</p>

<p><i class="fa fa-wallet"></i> Total Earnings</p>

<p><i class="fa fa-truck"></i> Total Deliveries</p>

</div>
</div>
</body>
</html>
