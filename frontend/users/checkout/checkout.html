<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkout</title>
<link rel="stylesheet" href="checkout.css">
</head>

<body>

<div class="checkout-container">

  <button class="back-btn" onclick="history.back()">← Back</button>
  <h2>Checkout</h2>

  <div class="checkout-wrapper">

    <!-- LEFT: FORM -->
    <div class="form-section">

      <!-- ADDRESS -->
      <div class="step" id="address-step">
        <h3>Delivery Address</h3>
        <form id="address-form">
          <input type="text" id="name" placeholder="Full Name" required>
          <input type="tel" id="phone" placeholder="Phone Number" required>
          <textarea id="address" placeholder="Full Address" required></textarea>
          <button type="button" onclick="nextStep('payment-step')">Next</button>
        </form>
      </div>

      <!-- PAYMENT -->
      <div class="step" id="payment-step" style="display:none;">
        <h3>Payment</h3>
        <label><input type="radio" name="payment" value="cod" checked> COD</label>
        <label><input type="radio" name="payment" value="upi"> UPI</label>
        <br><br>
        <button onclick="nextStep('confirm-step')">Next</button>
        <button onclick="prevStep('address-step')">Back</button>
      </div>

      <!-- CONFIRM -->
      <div class="step" id="confirm-step" style="display:none;">
          <h3>Confirm</h3>
            <div class="confirm-box">
              <p><strong>Name:</strong> <span id="c-name"></span></p>
               <p><strong>Phone:</strong> <span id="c-phone"></span></p>
               <p><strong>Address:</strong> <span id="c-address"></span></p>
               <p><strong>Payment:</strong> <span id="c-payment"></span></p>
            </div>
          <button onclick="placeOrder()">Place Order</button>
          <button onclick="prevStep('payment-step')">Back</button>
      </div>

    </div>

    <!-- RIGHT: SUMMARY -->
    <div class="summary-section">
      <h3>Order Summary</h3>
      <div id="order-summary"></div>
    </div>

  </div>

</div>

<script src="checkout.js"></script>
</body>
</html>
