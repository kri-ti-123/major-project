<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>venders</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="products.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- NAV -->
<div class="navbar">
    <div class="logo"><span class="servi">Servi</span><span class="go">GO</span></div>
    <div class="nav-links">
        <a href="products.html">Products</a>
        <a href="../orders/orders.html">orders</a>
        <a href="../profilev/profilev.html">Profile</a>
    </div>
</div>


<!-- MAIN -->
<div class="main">

    <!-- LEFT -->
    <div class="left">
        <img class="shop-img" src="https://images.unsplash.com/photo-1600891964599-f61ba0e24092" alt="Shop">

        <div class="earning-card">
            <h3>Earnings Summary</h3>
            <div class="earning">
                <span>Today's Earnings</span>
                <span>$128.50</span>
            </div>
            <div class="earning">
                <span>Monthly Earnings</span>
                <span>$1,245.75</span>
            </div>
        </div>
    </div>
      <!-- RIGHT -->
    <div class="right">
        <div class="card">
            <div class="card-header">
                <h2>Product Management</h2>
            </div>
            <div>    
                <button class="add-btn">
                <i class="fa fa-plus"></i>Add New Item</button>
            </div>
            <!-- PRODUCTS -->
            <div class="product">
                <div class="product-left">
                    <img src="https://images.unsplash.com/photo-1567306226416-28f0efdc88ce">
                    <strong>Fresh Apples</strong>
                </div>
                <input class="price" value="$ 2.50">
                <div class="actions">
                    <button class="icon-btn">✏️</button>
                    <button class="icon-btn">🗑️</button>
                    <span class="status available">Available</span>
                </div>
            </div>
            <div class="product">
                <div class="product-left">
                    <img src="https://images.unsplash.com/photo-1567306226416-28f0efdc88ce">
                    <strong>Fresh oranges</strong>
                </div>
                <input class="price" value="$ 2.50">
                <div class="actions">
                    <button class="icon-btn">✏️</button>
                    <button class="icon-btn">🗑️</button>
                    <span class="status available">Available</span>
                </div>
            </div>
            <div class="product">
                <div class="product-left">
                    <img src="https://images.unsplash.com/photo-1567306226416-28f0efdc88ce">
                    <strong>Fresh pineapples</strong>
                </div>
                <input class="price" value="$ 2.50">
                <div class="actions">
                    <button class="icon-btn">✏️</button>
                    <button class="icon-btn">🗑️</button>
                    <span class="status available">Available</span>
                </div>
            </div>
        </div>
    </div>
</div>



</body>
</html>
