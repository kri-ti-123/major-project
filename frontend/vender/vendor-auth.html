<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Signup - ServiGo</title>
    <link rel="stylesheet" href="vendor-auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <!-- Back Button -->
            <button class="back-btn" onclick="window.location.href='index.html'">
                <i class="fa-solid fa-arrow-left"></i> Back
            </button>

            <!-- Login Form -->
            <div id="login-form" class="form-container active">
                <h2>Login as User</h2>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="login-email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="submit-btn">Login</button>
                </form>
                <p class="toggle-text">
                    Don't have an account? 
                    <a href="#" onclick="toggleForms(event)">Sign Up</a>
                </p>
            </div>

            <!-- Signup Form -->
            <div id="signup-form" class="form-container">
                <h2>Sign Up as User</h2>
                <form onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="signup-name" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="signup-email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="signup-phone" placeholder="Enter your phone number" required>
                    </div>
                     <div class="form-group">
                        <label>Shop Name</label>
                        <input type="text" id="signup-shopname" placeholder="Enter your  shop name" required>
                    </div>
                     <div class="form-group">
                        <label>Address</label>
                        <input type="text" id="signup-address" placeholder="Enter your address" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="signup-password" placeholder="Enter your password" required>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" id="signup-confirm-password" placeholder="Confirm your password" required>
                    </div>
                    <button type="submit" class="submit-btn">Sign Up</button>
                </form>
                <p class="toggle-text">
                    Already have an account? 
                    <a href="#" onclick="toggleForms(event)">Login</a>
                </p>
            </div>
        </div>
    </div>

    <script src="vendor-auth.js"></script>
</body>
</html>
